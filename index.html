<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burger Content Engine</title>
<meta name="description" content="Dashboard, calendar, recording queue, scripts and thumbnail tests for the HanneBurger and BurgerCam channels.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0A0D0B; --bg2:#101512; --grey:#161B18;
  --glass:rgba(24,30,26,.58); --glass2:rgba(33,41,36,.62); --well:rgba(8,11,9,.5);
  --line:rgba(134,255,77,.14); --line2:rgba(134,255,77,.30);
  --text:#E6EFE7; --dim:#90A395; --faint:#65756A;
  --lime:#86FF4D; --limeD:#4FB82E; --red:#FF3B4E; --yellow:#FFC93C;
  --shadow:0 18px 44px rgba(0,0,0,.55); --shadow-s:0 6px 18px rgba(0,0,0,.4);
  --f-display:"Anton","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:16px; --rs:11px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E7ECE6; --bg2:#DCE3DA; --grey:#F2F6F1;
    --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.8); --well:rgba(255,255,255,.55);
    --line:rgba(30,90,20,.16); --line2:rgba(30,90,20,.34);
    --text:#101710; --dim:#57685A; --faint:#7E8D80;
    --lime:#2C7A16; --limeD:#3E9622; --red:#C41E2F; --yellow:#9A6B00;
    --shadow:0 14px 34px rgba(40,60,35,.16); --shadow-s:0 4px 14px rgba(40,60,35,.12);
  }
}
:root[data-theme="light"]{
  --bg:#E7ECE6; --bg2:#DCE3DA; --grey:#F2F6F1;
  --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.8); --well:rgba(255,255,255,.55);
  --line:rgba(30,90,20,.16); --line2:rgba(30,90,20,.34);
  --text:#101710; --dim:#57685A; --faint:#7E8D80;
  --lime:#2C7A16; --limeD:#3E9622; --red:#C41E2F; --yellow:#9A6B00;
  --shadow:0 14px 34px rgba(40,60,35,.16); --shadow-s:0 4px 14px rgba(40,60,35,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.55;
  display:grid;grid-template-columns:242px 1fr;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at 12% -8%, rgba(134,255,77,.10), transparent 60%),
    radial-gradient(760px 520px at 92% 4%, rgba(255,59,78,.08), transparent 62%),
    linear-gradient(180deg, var(--bg2), var(--bg) 42%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:46px 46px;opacity:.5}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance;margin:0}
a{color:var(--lime)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* rail */
.rail{position:sticky;top:0;height:100vh;z-index:5;display:flex;flex-direction:column;overflow-y:auto;
  margin:12px 0 12px 12px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
.rail-top{padding:16px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.rail-top img{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);flex:0 0 auto}
.logo{font-family:var(--f-display);font-size:22px;line-height:1;color:var(--lime);letter-spacing:.04em;text-shadow:0 0 18px rgba(134,255,77,.45)}
.logo+span{display:block;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.26em;color:var(--faint);text-transform:uppercase;margin-top:4px}
.rail h4{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.24em;color:var(--faint);text-transform:uppercase;padding:15px 16px 6px;font-weight:400;margin:0}
.chan-wrap{margin:0 8px 5px}
.chan{display:flex;align-items:center;gap:9px;background:transparent;border:0;border-radius:10px;padding:8px 10px;margin:0;
  width:100%;color:var(--dim);font:inherit;text-align:left;cursor:pointer}
.chan .cn{margin-left:auto;font-family:var(--f-mono);font-size:9px;color:var(--faint);
  border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.chan[aria-pressed="true"] .cn{color:var(--lime);border-color:var(--line2)}
.chan-links{display:flex;gap:5px;padding:5px 0 0 10px}
.clink{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;text-decoration:none;
  color:var(--faint);border:1px solid var(--line);border-radius:7px;padding:4px 8px;transition:color .16s,border-color .16s,background .16s}
.clink:hover{color:var(--lime);border-color:var(--line2);background:var(--glass2)}
.dateset{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dateset input,.dateset select{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--text);
  background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.dateset input:focus,.dateset select:focus{outline:none;border-color:var(--line2)}
.dateset .btn{padding:5px 9px;font-size:9px}
.fhint{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin:0 0 14px}
.dateset em{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);font-style:normal}
.chan .led{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 9px currentColor}
.chan b{font-size:13px;font-weight:600;display:block}
.chan i{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;font-style:normal;color:var(--faint);text-transform:uppercase}
.chan[aria-pressed="true"]{background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.chan:disabled{opacity:.42;cursor:not-allowed}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px 10px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:transparent;border:0;
  border-radius:10px;padding:8px 11px;color:var(--dim);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.nav button span.c{font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.nav button[aria-current="true"]{background:var(--glass2);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line2)}
.nav button[aria-current="true"] span.c{color:var(--lime)}
.nav button:hover:not([aria-current="true"]){background:var(--glass2);color:var(--text)}
.rail-foot{margin-top:auto;padding:13px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.railbtn{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:transparent;
  border:1px solid var(--line);color:var(--dim);padding:7px 10px;cursor:pointer;border-radius:9px;text-align:left}
.railbtn:hover{border-color:var(--line2);color:var(--lime)}
.mini{font-family:var(--f-mono);font-size:9px;color:var(--faint)}

/* main */
.main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;z-index:1}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:20px 24px 14px;flex:0 0 auto;flex-wrap:wrap}
.top h1{font-size:23px}
.top p{margin:4px 0 0;color:var(--dim);font-size:13px;max-width:78ch}
.acts{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.btn{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--dim);border:1px solid var(--line);
  padding:8px 12px;cursor:pointer;border-radius:9px}
.btn:hover{color:var(--lime);border-color:var(--line2)}
.btn.on{color:var(--lime);border-color:var(--line2);background:var(--glass2)}
.seg{display:flex;gap:3px;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:transparent;
  border:0;color:var(--dim);padding:6px 12px;cursor:pointer;border-radius:7px}
.seg button[aria-selected="true"]{background:var(--glass2);color:var(--lime);box-shadow:inset 0 0 0 1px var(--line2)}
.scroll{overflow:auto;flex:1 1 auto;padding:0 24px 60px}
.view,.sub{display:none}.view.on,.sub.on{display:block}
.sect{margin-bottom:22px}
.sect>h2{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase;font-weight:400;margin-bottom:10px}

/* panels */
.panel{background:var(--glass);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;box-shadow:var(--shadow-s)}
.panel h2{font-size:15px;color:var(--lime);margin-bottom:10px}
.panel p{margin:0 0 9px;color:var(--dim)}
.panel ul{margin:0;padding-left:17px}.panel li{margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:13px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.tile{background:var(--well);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px}
.tile i{display:block;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:var(--faint);font-style:normal;text-transform:uppercase}
.tile b{display:block;font-family:var(--f-mono);font-size:21px;color:var(--lime);font-weight:500;font-variant-numeric:tabular-nums;
  margin-top:3px;text-shadow:0 0 14px rgba(134,255,77,.3)}
.tile s{display:block;font-family:var(--f-mono);font-size:9px;color:var(--faint);text-decoration:none;margin-top:3px;line-height:1.4}
.ch-head{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.ch-head .led{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor}
.ch-head h2{margin:0;font-size:17px;color:var(--text)}
.ch-head .tag{margin-left:auto}

/* chips */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);
  padding:2px 8px;border-radius:999px;color:var(--dim);white-space:nowrap;background:var(--well)}
.chip.lime{color:var(--lime);border-color:var(--line2)}
.chip.red{color:var(--red);border-color:var(--red)}
.chip.yellow{color:var(--yellow);border-color:var(--yellow)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(262px,1fr);gap:12px;align-items:start}
.col{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:var(--r);display:flex;flex-direction:column;box-shadow:var(--shadow-s)}
.col.over{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 0 26px rgba(134,255,77,.16)}
.col-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 9px currentColor}
.col-h h2{font-size:13px;letter-spacing:.07em;flex:1 1 auto}
.col-h .n{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);background:var(--well);border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.col-h p{width:100%;margin:2px 0 0;font-family:var(--f-mono);font-size:9px;letter-spacing:.07em;color:var(--faint);text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:8px;padding:11px;min-height:58px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px;cursor:grab;
  text-align:left;color:inherit;font:inherit;width:100%;display:block;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tone,var(--line2))}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow-s);transform:translateY(-2px)}
.card.drag{opacity:.34}
.card h3{font-family:var(--f-body);font-weight:600;text-transform:none;letter-spacing:0;font-size:13.8px;line-height:1.3;margin:0 0 8px 4px}
.card .chips{margin-left:4px}

/* tables */
.wrapx{overflow-x:auto;border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--glass);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--glass2)}
.tbl .nm{font-weight:600;cursor:pointer}
.tbl .nm:hover{color:var(--lime)}
.tbl .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}

/* calendar */
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-h h2{font-size:17px;color:var(--text)}
.cal-h .sp{flex:1 1 auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;text-align:center;padding-bottom:3px}
.day{background:var(--well);border:1px solid var(--line);border-radius:var(--rs);min-height:100px;padding:7px 7px 8px;
  display:flex;flex-direction:column;gap:4px;cursor:copy;transition:border-color .12s}
.day.out{opacity:.3;cursor:default}
.day.today{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 0 22px rgba(134,255,77,.14)}
.day.over{border-color:var(--lime);background:var(--glass2);box-shadow:0 0 0 1px var(--lime)}
.day .dn{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;pointer-events:none}
.day.today .dn{color:var(--lime)}
.day .add{font-family:var(--f-mono);font-size:9px;color:var(--faint);opacity:0;text-align:center;padding:3px 0;
  border:1px dashed var(--line);border-radius:7px;margin-top:auto;pointer-events:none}
.day:not(.out):hover .add{opacity:.7}
.ev{display:block;width:100%;text-align:left;font:inherit;font-size:11px;line-height:1.28;padding:4px 6px;border-radius:7px;
  border:1px solid var(--line);background:var(--glass2);color:var(--text);cursor:grab;position:relative;padding-left:12px}
.ev::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--tone)}
.ev:hover{border-color:var(--line2);color:var(--lime)}
.ev.drag{opacity:.35}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px}
.legend span{font-family:var(--f-mono);font-size:9.5px;color:var(--faint);display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* week */
.week{display:flex;flex-direction:column;gap:9px}
.night{display:grid;grid-template-columns:126px 1fr;background:var(--glass);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-s)}
.night-d{background:var(--well);padding:14px 13px;border-right:1px solid var(--line)}
.night-d b{display:block;font-family:var(--f-mono);font-size:12px;color:var(--lime)}
.night-d i{display:block;font-family:var(--f-mono);font-size:9px;color:var(--faint);font-style:normal;letter-spacing:.07em;margin-top:3px}
.night-b{padding:13px 16px 15px}
.night-b h3{font-family:var(--f-body);font-weight:600;text-transform:none;letter-spacing:0;font-size:16px;margin-bottom:4px}
.night-b p{margin:0 0 9px;color:var(--dim);max-width:80ch;font-size:13.5px}
.hunt{display:flex;flex-wrap:wrap;gap:5px;list-style:none;padding:0;margin:0}
.hunt li{font-family:var(--f-mono);font-size:10px;color:var(--text);background:var(--well);border:1px solid var(--line);padding:3px 8px;border-radius:999px}

/* performance */
.vid{display:grid;grid-template-columns:160px 1fr;gap:14px;background:var(--glass);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--shadow-s)}
.vid img{width:100%;border-radius:var(--rs);border:1px solid var(--line);display:block}
.vid h3{font-family:var(--f-body);font-weight:600;text-transform:none;letter-spacing:0;font-size:15.5px;margin-bottom:6px}
.vid h3 a{color:var(--text);text-decoration:none}
.vid h3 a:hover{color:var(--lime)}
.vid .sub{display:flex!important;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.vid p{margin:0 0 9px;color:var(--dim);font-size:13px;max-width:74ch}
.pend{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);border:1px dashed var(--line);border-radius:var(--rs);padding:8px 11px}
.range{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.range input[type="date"]{font-family:var(--f-mono);font-size:11px;background:var(--well);border:1px solid var(--line);
  color:var(--text);padding:7px 9px;border-radius:9px;color-scheme:dark}
:root[data-theme="light"] .range input[type="date"]{color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .range input[type="date"]{color-scheme:light}}

/* loop / pairs / ladder */
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.loop>div{padding:13px 15px;border-right:1px solid var(--line)}
.loop>div:last-child{border-right:0}
.loop h5{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;font-weight:400}
.loop p{margin:0;font-size:13px}
.loop .empty{color:var(--faint);font-style:italic}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:10px}
.pair{background:var(--glass2);border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px;border-top:2px solid var(--lime)}
.pair .lab{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.pair .lab b{font-family:var(--f-display);font-size:16px;color:var(--lime);line-height:1}
.pair .ttl{font-weight:600;font-size:13.5px;margin-bottom:6px}
.pair .th{color:var(--dim);font-size:13px;margin:0}
.ladder{list-style:none;padding:0;margin:0;counter-reset:s}
.ladder li{counter-increment:s;display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.ladder li:last-child{border-bottom:0}
.ladder li::before{content:counter(s);font-family:var(--f-mono);color:var(--lime);font-size:12px}
.strip{width:100%;border:1px solid var(--line);border-radius:var(--rs);display:block;margin-bottom:9px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,7,5,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:14px;right:14px;bottom:14px;width:min(660px,calc(100% - 28px));z-index:41;
  background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);
  transform:translateX(calc(100% + 20px));transition:transform .2s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.on{transform:none}
.d-head{padding:16px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;background:var(--glass2)}
.d-head h2{font-family:var(--f-body);font-weight:600;text-transform:none;letter-spacing:0;font-size:19px;padding-right:46px}
.close{position:absolute;top:14px;right:16px;background:var(--well);border:1px solid var(--line);color:var(--dim);
  font-family:var(--f-mono);font-size:13px;line-height:1;padding:6px 10px;cursor:pointer;border-radius:9px}
.close:hover{color:var(--red);border-color:var(--red)}
.d-body{overflow-y:auto;padding:17px 20px 44px;flex:1 1 auto}
.props{width:100%;border-collapse:collapse;margin-bottom:18px}
.props th{text-align:left;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:400;padding:5px 12px 5px 0;width:130px;vertical-align:top}
.props td{padding:5px 0;vertical-align:top}
.d-body h4{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);
  margin:21px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.d-body p{margin:0 0 9px;max-width:70ch}
.d-body ul{margin:0;padding-left:17px}.d-body li{margin-bottom:4px}
.note{border-left:2px solid var(--red);background:var(--well);padding:10px 13px;color:var(--dim);font-size:13.5px;border-radius:var(--rs)}
pre.script{background:var(--well);border:1px solid var(--line);border-radius:var(--rs);padding:14px;overflow-x:auto;
  white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;line-height:1.62;color:var(--text);margin:0}
.form label{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:14px 0 5px}
.form input,.form select,.form textarea{width:100%;background:var(--well);border:1px solid var(--line);color:var(--text);
  font:inherit;font-size:14px;padding:9px 11px;border-radius:var(--rs)}
.form textarea{min-height:88px;resize:vertical}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formbar{display:flex;gap:8px;margin-top:18px}
.primary{background:var(--lime);color:#0A0D0B;border:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:500}
.primary:hover{filter:brightness(1.1)}
@media (max-width:980px){
  body{grid-template-columns:1fr}
  .rail{position:static;height:auto;margin:12px}
  .main{height:auto;overflow:visible}.scroll{overflow:visible}
  .board{grid-auto-flow:row;grid-auto-columns:auto}
  .night,.vid{grid-template-columns:1fr}
  .night-d{border-right:0;border-bottom:1px solid var(--line)}
  .cal{gap:3px}.day{min-height:76px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>
</head>
<body>

<nav class="rail">
  <div class="rail-top"><img src="icon-512.png" alt=""><div><div class="logo">BURGER</div><span>Content Engine</span></div></div>
  <h4>Channels</h4><div id="chans"></div>
  <h4>Views</h4><div class="nav" id="nav"></div>
  <div class="rail-foot">
    <button class="railbtn" id="export">Copy board state</button>
    <button class="railbtn" id="theme">Switch theme</button>
    <button class="railbtn" id="reset">Reset board</button>
    <span class="mini" id="stamp"></span>
  </div>
</nav>

<div class="main">
  <header class="top"><div><h1 id="vt"></h1><p id="vs"></p></div><div class="acts" id="acts"></div></header>
  <div class="scroll">
    <section class="view on" id="view-home"></section>
    <section class="view" id="view-board">
      <div class="sub on" id="sub-board"><div class="board" id="board"></div></div>
      <div class="sub" id="sub-table"><div class="wrapx"><table class="tbl" id="table"></table></div></div>
      <div class="sub" id="sub-week"><div class="week" id="week"></div></div>
    </section>
    <section class="view" id="view-metrics"></section>
    <section class="view" id="view-thumbs"></section>
    <section class="view" id="view-playbook"></section>
    <section class="view" id="view-roadmap"></section>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Card detail">
  <div class="d-head"><button class="close" id="close" aria-label="Close">✕</button><h2 id="d-title"></h2></div>
  <div class="d-body" id="d-body"></div>
</aside>

<script src="data.js"></script>
<script>
(function(){
  var D = window.ENGINE;
  var K_COL = "burger-engine-board-v1", K_DATE = "burger-engine-dates-v1", K_NEW = "burger-engine-custom-v1",
      K_KIND = "burger-engine-kinds-v1";
  function load(k, d){ try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch(e){ return d; } }
  function put(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  var moved = load(K_COL, {}), dates = load(K_DATE, {}), custom = load(K_NEW, []), kinds = load(K_KIND, {});
  function allCards(){ return D.cards.concat(custom); }
  var colOf = function(c){ return moved[c.id] || c.col; };
  var dateOf = function(c){ return dates[c.id] !== undefined ? dates[c.id] : c.date; };
  var kindOf = function(c){ return kinds[c.id] || c.kind; };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); };
  var num = function(n){ return n == null ? "" : Number(n).toLocaleString("en-GB"); };
  var byId = function(id){ return allCards().filter(function(c){ return c.id === id; })[0]; };

  var TONE = {ideas:"var(--faint)", capture:"var(--red)", edit:"var(--yellow)", ready:"var(--lime)", published:"var(--limeD)"};
  var KINDTONE = {capture:"var(--red)", upload:"var(--yellow)", published:"var(--lime)", backlog:"var(--faint)"};
  var KINDS = [["capture","Capture night"], ["upload","Upload target"], ["published","Published"], ["backlog","No date"]];
  var PRIO = {High:"red", Medium:"yellow", Low:"", Done:"lime"};
  var CHTONE = {hanneburger:"var(--lime)", burgercam:"var(--yellow)"};
  var TODAY = "2026-09-11";

  var VIEWS = [
    {id:"home",     n:"Home",       t:"Dashboard",        s:"Both channels in one place. Drag anything on the calendar to move it, or click an empty day to add an idea."},
    {id:"board",    n:"Board",      t:"Project",          s:"Board, table and week are three views of the same cards. Drag a card to change its status."},
    {id:"metrics",  n:"Performance",t:"Performance",      s:"Only videos that are actually live. View counts are real, the deeper numbers appear once a Studio read is taken."},
    {id:"thumbs",   n:"Thumbnails", t:"Thumbnail engine", s:"Three title and thumbnail pairs per video, each a different pitch, against the channel's own rules."},
    {id:"playbook", n:"Playbook",   t:"Playbook",         s:"The rules this channel runs on, taken from its own results."},
    {id:"roadmap",  n:"Roadmap",    t:"What this becomes",s:"What the engine does now, and what can be automated next."}
  ];
  var SUBS = [{id:"board", n:"Board"}, {id:"table", n:"Table"}, {id:"week", n:"Week"}];
  var sub = "board";
  var pfmt = "long";   /* which Performance tab is showing. NOT fmt, that is the date formatter. */
  var chan = (D.channels[0] || {}).id || "hanneburger";   /* which channel the working views show */
  function mine(x){ return (x.channel || "hanneburger") === chan; }
  function chanName(){ var c = D.channels.filter(function(x){ return x.id === chan; })[0]; return c ? c.name : chan; }
  function segHTML(items, on, key){
    return '<div class="seg">' + items.map(function(i){
      return '<button data-' + key + '="' + i.id + '" aria-selected="' + (i.id === on) + '">' + esc(i.n) +
             (i.c != null ? '<span class="c">' + i.c + '</span>' : '') + '</button>'; }).join("") + '</div>';
  }

  /* ---------- rail ---------- */
  function links(c){
    return (c.url ? '<a class="clink" href="' + esc(c.url) + '" target="_blank" rel="noopener">Channel</a>' : "") +
           (c.studio ? '<a class="clink" href="' + esc(c.studio) + '" target="_blank" rel="noopener">Studio</a>' : "");
  }
  function drawChans(){
    document.getElementById("chans").innerHTML = D.channels.map(function(c){
      var cards = allCards().filter(function(x){ return (x.channel || "hanneburger") === c.id; }).length;
      return '<div class="chan-wrap"><button class="chan" data-ch="' + c.id + '" aria-pressed="' + (c.id === chan) + '">' +
        '<span class="led" style="color:' + CHTONE[c.id] + ';background:' + CHTONE[c.id] + '"></span>' +
        '<span><b>' + esc(c.name) + '</b><i>' + esc(c.tag) + '</i></span>' +
        '<span class="cn">' + cards + '</span></button>' +
        '<div class="chan-links">' + links(c) + '</div></div>'; }).join("");
    document.querySelectorAll("#chans .chan").forEach(function(b){
      b.addEventListener("click", function(){
        if (b.dataset.ch === chan) return;
        chan = b.dataset.ch;
        drawChans(); drawNav(); drawBoard(); drawTable(); drawPerf(); drawCal();
        if (current !== "home") show(current);
      });
    });
  }
  drawChans();
  function drawNav(){
    document.getElementById("nav").innerHTML = VIEWS.map(function(v, i){
      var c = {board:allCards().filter(mine).length, metrics:D.live.filter(mine).length,
               thumbs:D.cards.filter(function(x){ return x.thumbs && mine(x); }).length}[v.id] || "";
      return '<button data-v="' + v.id + '" aria-current="' + (v.id === current) + '">' + esc(v.n) +
             (c ? '<span class="c">' + c + '</span>' : '') + '</button>'; }).join("");
    document.querySelectorAll("#nav button").forEach(function(b){ b.addEventListener("click", function(){ show(b.dataset.v); }); });
  }
  document.getElementById("stamp").textContent = "Updated " + D.updated;

  var current = "home";
  function show(id){
    current = id;
    var v = VIEWS.filter(function(x){ return x.id === id; })[0];
    document.getElementById("vt").textContent = v.t;
    document.getElementById("vs").textContent =
      (id === "board" || id === "metrics" || id === "thumbs") ? chanName() + ". " + v.s : v.s;
    document.querySelectorAll(".view").forEach(function(s){ s.classList.remove("on"); });
    document.getElementById("view-" + id).classList.add("on");
    document.querySelectorAll("#nav button").forEach(function(b){ b.setAttribute("aria-current", b.dataset.v === id ? "true" : "false"); });
    document.getElementById("acts").innerHTML =
        id === "board"   ? segHTML(SUBS, sub, "sub")
      : id === "metrics" ? segHTML(formatTabs(), pfmt, "fmt")
      : "";
    document.querySelectorAll("#acts .seg button[data-sub]").forEach(function(b){
      b.addEventListener("click", function(){
        sub = b.dataset.sub;
        document.querySelectorAll(".sub").forEach(function(s){ s.classList.remove("on"); });
        document.getElementById("sub-" + sub).classList.add("on");
        document.querySelectorAll("#acts .seg button[data-sub]").forEach(function(x){ x.setAttribute("aria-selected", x.dataset.sub === sub); });
      });
    });
    document.querySelectorAll("#acts .seg button[data-fmt]").forEach(function(b){
      b.addEventListener("click", function(){
        pfmt = b.dataset.fmt;
        document.querySelectorAll("#acts .seg button[data-fmt]").forEach(function(x){ x.setAttribute("aria-selected", x.dataset.fmt === pfmt); });
        drawPerf();
      });
    });
    document.querySelector(".scroll").scrollTop = 0;
  }

  /* ---------- home ---------- */
  var calYear = 2026, calMonth = 8;
  var MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function drawHome(){
    document.getElementById("view-home").innerHTML =
      '<div class="sect"><h2>Channels</h2><div class="grid2">' + D.channels.map(function(c){
        return '<div class="panel"><div class="ch-head"><span class="led" style="color:' + CHTONE[c.id] + ';background:' + CHTONE[c.id] + '"></span>' +
          '<h2>' + esc(c.name) + '</h2><span class="chip ' + (c.active ? "lime" : "yellow") + ' tag">' + esc(c.tag) + '</span></div>' +
          '<div class="chan-links" style="padding:0 0 12px">' + links(c) + '</div>' +
          '<div class="tiles">' + c.stats.map(function(s){
            return '<div class="tile"><i>' + esc(s.k) + '</i><b>' + esc(s.v) + '</b><s>' + esc(s.s) + '</s></div>'; }).join("") +
          '</div></div>'; }).join("") + '</div></div>' +
      '<div class="sect"><div class="panel"><div class="cal-h"><h2 id="calT"></h2><span class="sp"></span>' +
        '<button class="btn" id="prev">Prev</button><button class="btn" id="today">Today</button><button class="btn" id="next">Next</button></div>' +
        '<div class="cal" id="cal"></div>' +
        '<div class="legend">' +
          '<span><i style="background:var(--red)"></i>Capture night</span>' +
          '<span><i style="background:var(--yellow)"></i>Upload target</span>' +
          '<span><i style="background:var(--lime)"></i>Published</span>' +
          '<span><i style="background:var(--faint)"></i>No date set</span>' +
          '<span style="margin-left:auto">Drag to move · click an empty day to add</span>' +
        '</div></div></div>';
    document.getElementById("prev").addEventListener("click", function(){ calMonth--; if (calMonth < 0){ calMonth = 11; calYear--; } drawCal(); });
    document.getElementById("next").addEventListener("click", function(){ calMonth++; if (calMonth > 11){ calMonth = 0; calYear++; } drawCal(); });
    document.getElementById("today").addEventListener("click", function(){ calYear = 2026; calMonth = 8; drawCal(); });
    drawCal();
  }
  function drawCal(){
    document.getElementById("calT").textContent = MON[calMonth] + " " + calYear;
    var first = new Date(calYear, calMonth, 1);
    var start = (first.getDay() + 6) % 7;
    var days = new Date(calYear, calMonth + 1, 0).getDate();
    var prevDays = new Date(calYear, calMonth, 0).getDate();
    var cells = [];
    for (var i = 0; i < start; i++) cells.push({d: prevDays - start + 1 + i, out: true});
    for (var d = 1; d <= days; d++)
      cells.push({d: d, out: false, iso: calYear + "-" + String(calMonth + 1).padStart(2,"0") + "-" + String(d).padStart(2,"0")});
    var tail = 1; while (cells.length % 7) cells.push({d: tail++, out: true});
    document.getElementById("cal").innerHTML =
      ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(x){ return '<div class="dow">' + x + '</div>'; }).join("") +
      cells.map(function(c){
        var evs = c.iso ? allCards().filter(function(x){ return dateOf(x) === c.iso; }) : [];
        return '<div class="day' + (c.out ? " out" : "") + (c.iso === TODAY ? " today" : "") + '"' +
          (c.iso ? ' data-iso="' + c.iso + '"' : '') + '><span class="dn">' + c.d + '</span>' +
          evs.map(function(e){
            return '<button class="ev" draggable="true" data-id="' + e.id + '" style="--tone:' + (KINDTONE[kindOf(e)] || "var(--faint)") + '">' +
              esc(e.title) + '</button>'; }).join("") +
          (c.out ? "" : '<span class="add">+ idea</span>') + '</div>'; }).join("");
    wireCal();
  }
  function wireCal(){
    var dragId = null;
    document.querySelectorAll(".ev").forEach(function(el){
      el.addEventListener("click", function(e){ e.stopPropagation(); open(el.dataset.id); });
      el.addEventListener("dragstart", function(e){ dragId = el.dataset.id; el.classList.add("drag");
        try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(err){} });
      el.addEventListener("dragend", function(){ el.classList.remove("drag"); dragId = null; });
    });
    document.querySelectorAll(".day[data-iso]").forEach(function(cell){
      cell.addEventListener("dragover", function(e){ e.preventDefault(); cell.classList.add("over"); });
      cell.addEventListener("dragleave", function(){ cell.classList.remove("over"); });
      cell.addEventListener("drop", function(e){
        e.preventDefault(); cell.classList.remove("over");
        var id = dragId; try { id = e.dataTransfer.getData("text/plain") || dragId; } catch(err){}
        if (!id) return;
        setDate(id, cell.dataset.iso, null);
      });
      cell.addEventListener("click", function(){ newCard(cell.dataset.iso); });
    });
  }
  function setDate(id, iso, kind){
    dates[id] = iso || ""; put(K_DATE, dates);
    if (kind){ kinds[id] = kind; put(K_KIND, kinds); }
    else if (!iso){ kinds[id] = "backlog"; put(K_KIND, kinds); }
    var c = byId(id);
    if (c){
      c.date = iso || null;
      c.night = iso ? fmt(iso) : "Unscheduled";
      c.kind = kindOf(c) || (iso ? "capture" : "backlog");
      if (c.custom) put(K_NEW, custom);
    }
    drawCal(); drawBoard(); drawTable();
    return c;
  }
  function applyStored(){
    allCards().forEach(function(c){
      if (dates[c.id] !== undefined){
        c.date = dates[c.id] || null;
        c.night = dates[c.id] ? fmt(dates[c.id]) : "Unscheduled";
      }
      if (kinds[c.id]) c.kind = kinds[c.id];
    });
  }
  function fmt(iso){
    var p = iso.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()] + " " + (+p[2]) + " " + MON[+p[1] - 1].slice(0,3);
  }

  /* ---------- board / table / week ---------- */
  function chips(c){
    var out = [], p = c.props || {};
    if (c.night && c.night !== "Unscheduled") out.push('<span class="chip' +
      (/^(Fri|Sat|Sun|Mon|Tue|Wed|Thu)/.test(c.night) ? " red" : "") + '">' + esc(c.night) + '</span>');
    if (p.lane) out.push('<span class="chip' + (p.lane === "Identity" ? " lime" : "") + '">' + esc(p.lane) + '</span>');
    if (p.priority) out.push('<span class="chip ' + (PRIO[p.priority] || "") + '">' + esc(p.priority) + '</span>');
    if (c.script) out.push('<span class="chip lime">Script</span>');
    if (c.thumbs) out.push('<span class="chip yellow">Thumbs</span>');
    if (c.custom) out.push('<span class="chip yellow">Added by you</span>');
    return out.join("");
  }
  function drawBoard(){
    document.getElementById("board").innerHTML = D.columns.map(function(col){
      var cards = allCards().filter(function(c){ return colOf(c) === col.id && mine(c); });
      return '<div class="col" data-col="' + col.id + '"><div class="col-h">' +
        '<span class="dot" style="color:' + TONE[col.id] + ';background:' + TONE[col.id] + '"></span>' +
        '<h2>' + esc(col.name) + '</h2><span class="n">' + cards.length + '</span><p>' + esc(col.hint) + '</p></div>' +
        '<div class="stack">' + cards.map(function(c){
          return '<button class="card" draggable="true" data-id="' + c.id + '" style="--tone:' + TONE[col.id] + '">' +
            '<h3>' + esc(c.title) + '</h3><div class="chips">' + chips(c) + '</div></button>'; }).join("") +
        '</div></div>'; }).join("");
    var dragId = null;
    document.querySelectorAll(".card").forEach(function(el){
      el.addEventListener("click", function(){ open(el.dataset.id); });
      el.addEventListener("dragstart", function(e){ dragId = el.dataset.id; el.classList.add("drag");
        try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(err){} });
      el.addEventListener("dragend", function(){ el.classList.remove("drag"); dragId = null; });
    });
    document.querySelectorAll(".col").forEach(function(col){
      col.addEventListener("dragover", function(e){ e.preventDefault(); col.classList.add("over"); });
      col.addEventListener("dragleave", function(){ col.classList.remove("over"); });
      col.addEventListener("drop", function(e){ e.preventDefault(); col.classList.remove("over");
        var id = dragId; try { id = e.dataTransfer.getData("text/plain") || dragId; } catch(err){}
        if (!id) return; moved[id] = col.dataset.col; put(K_COL, moved); drawBoard(); drawTable(); });
    });
  }
  function drawTable(){
    var cn = {}; D.columns.forEach(function(c){ cn[c.id] = c.name; });
    document.getElementById("table").innerHTML =
      '<thead><tr><th>Card</th><th>Status</th><th>Date</th><th>Session</th><th>Lane</th><th>Variable tested</th><th>Priority</th></tr></thead><tbody>' +
      allCards().map(function(c){
        var p = c.props || {};
        return '<tr><td class="nm" data-id="' + c.id + '">' + esc(c.title) + '</td>' +
          '<td><span class="chip" style="color:' + TONE[colOf(c)] + ';border-color:' + TONE[colOf(c)] + '">' + esc(cn[colOf(c)]) + '</span></td>' +
          '<td class="num">' + esc(c.night || "") + '</td><td class="num">' + esc(c.session || "") + '</td>' +
          '<td><span class="chip' + (p.lane === "Identity" ? " lime" : "") + '">' + esc(p.lane || "") + '</span></td>' +
          '<td class="num">' + esc(p.variable || "") + '</td>' +
          '<td><span class="chip ' + (PRIO[p.priority] || "") + '">' + esc(p.priority || "") + '</span></td></tr>'; }).join("") + '</tbody>';
    document.querySelectorAll(".tbl .nm").forEach(function(td){ td.addEventListener("click", function(){ open(td.dataset.id); }); });
  }
  document.getElementById("week").innerHTML = D.cards.filter(function(c){ return c.col === "capture"; })
    .map(function(c, i){
      return '<article class="night"><div class="night-d" style="border-left:2px solid ' + (c.id === "bottom1" ? "var(--lime)" : "var(--red)") + '">' +
        '<b>Night ' + (i + 1) + '</b><i>' + esc(c.night) + '</i><i>' + esc(c.session) + '</i></div>' +
        '<div class="night-b"><h3>' + esc(c.title) + '</h3><p>' + esc(c.why) + '</p><ul class="hunt">' +
        (c.clips || []).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></div></article>'; }).join("");

  /* ---------- performance ---------- */
  var rFrom = "", rTo = "";
  function kindOfVid(v){ return v.kind || (v.seconds != null && v.seconds <= 180 ? "short" : "long"); }
  function formatTabs(){
    return (D.formats || [{id:"long", name:"Long form"}, {id:"short", name:"Shorts"}]).map(function(f){
      return {id: f.id, n: f.name, c: D.live.filter(function(v){ return mine(v) && kindOfVid(v) === f.id; }).length}; });
  }
  function held(list){
    var w = 0, t = 0, xs = [];
    list.forEach(function(v){

    if (!xs.length || !t) return null;
    xs.sort(function(a, b){ return a - b; });

  }

  function mmss(n){ var m = Math.floor(n / 60); return m + ":" + String(n % 60).padStart(2, "0"); }
  function clock(n){
    if (n == null) return "";
    var h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = n % 60;
    return h ? h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0")
             : m + ":" + String(s).padStart(2, "0");
  }
  function isoSecs(iso){
    var g = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || "");
    if (!g) return null;
    return (+(g[1] || 0)) * 3600 + (+(g[2] || 0)) * 60 + (+(g[3] || 0));
  }
  function stampIt(m){
    var st = document.getElementById("stamp");
    var age = m.pulled ? Math.round((new Date(TODAY) - new Date(m.pulled)) / 86400000) : null;
    if (m.mode === "manual"){
      /* no automatic pull to stall. Say when it was read and leave it at that. */
      st.textContent = "Numbers read " + m.pulled;
      st.style.color = "";
      st.title = m.source || "Read by hand from YouTube Studio.";
    } else if (age != null && age > 2){
      /* the pull has stopped. Say so, do not pass frozen numbers off as current. */
      st.textContent = "Pull stalled, last ran " + m.pulled;
      st.style.color = "var(--yellow)";
      st.title = "The daily pull has not run in " + age + " days. The usual cause is the OAuth "
        + "refresh token being revoked, which happens seven days after consent while the Google "
        + "project sits in Testing status. The numbers below are from " + m.pulled + ".";
    } else {
      st.textContent = m.dataThrough ? "API, complete to " + m.dataThrough : "API, pulled " + m.pulled;
      st.style.color = "";
      st.title = m.lagDays
        ? "The Analytics API finalises about " + m.lagDays + " days behind. Studio is more current."
        : "";
    }
  }
  function setStat(ch, k, v){ ch.stats.forEach(function(x){ if (x.k === k) x.v = v; }); }
  function applyLive(m){
    if (!m || !m.channels || !m.channels.length) return;
    var rows = {}, have = {};
    (m.videos || []).forEach(function(v){ rows[v.video] = v; });
    D.live.forEach(function(v){ have[v.id] = true; });
    /* anything the pull found that is not on the page yet, usually a Short he just posted */
    (m.videos || []).forEach(function(r){
      if (have[r.video]) return;
      var sec = isoSecs(r.runtime);
      D.live.push({id: r.video, title: r.title || r.video, published: r.published || m.dataThrough,
        runtime: clock(sec), seconds: sec, kind: sec != null && sec <= 180 ? "short" : "long",
        views: r.views, channel: r.channel || "hanneburger", cardId: null, note: "",
        url: "https://www.youtube.com/watch?v=" + r.video,
        thumb: "https://i.ytimg.com/vi/" + r.video + "/mqdefault.jpg", analytics: {}});
    });
    D.live.sort(function(a, b){ return (a.published || "") < (b.published || "") ? 1 : -1; });
    D.live.forEach(function(v){
      var r = rows[v.id]; if (!r) return;
      v.views = r.views;
      v.analytics = v.analytics || {};
      if (r.averageViewDuration != null) v.analytics.avd = mmss(r.averageViewDuration);
      if (r.averageViewPercentage != null) v.analytics.avp = Math.round(r.averageViewPercentage * 10) / 10;
      if (r.subscribersGained != null) v.analytics.subs = r.subscribersGained;
      if (r.estimatedMinutesWatched != null) v.analytics.watchMinutes = r.estimatedMinutesWatched;
      v.analytics.read = "API, " + m.window.start + " to " + (m.dataThrough || m.window.end);
    });
    m.channels.forEach(function(c){
      var ch = D.channels.filter(function(x){ return x.channelId === c.id; })[0];
      if (!ch) return;
      setStat(ch, "Subscribers", num(c.subs));
      setStat(ch, "Videos", num(c.videos));
      setStat(ch, "Lifetime", num(c.views));
      setStat(ch, "Lifetime views", num(c.views));
      var t = ((m.byChannel || {})[c.id] || {}).totals || {};
      if (t.views != null) setStat(ch, "Views, 28d", num(t.views));
      if (t.estimatedMinutesWatched != null)
        setStat(ch, "Watch time", (Math.round(t.estimatedMinutesWatched / 6) / 10) + " h");
    });
    stampIt(m);
    if (current === "metrics") show("metrics");
    drawChans(); drawNav();

    drawHome(); drawPerf();
  }
  if (window.fetch) fetch("metrics.json", {cache: "no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(applyLive)
    .catch(function(){});
})();
</script>
